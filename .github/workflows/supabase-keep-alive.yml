name: Keep Supabase Active

on:
    schedule:
        - cron: '0 9 */3 * *' # Every 3 days at 09:00 UTC
    workflow_dispatch:

jobs:
    ping:
        runs-on: ubuntu-latest
        steps:
            - name: Query analyses table
              run: |
                  curl -f -s -o /dev/null \
                    -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
                    "${{ secrets.SUPABASE_URL }}/rest/v1/analyses?select=id&limit=1"
