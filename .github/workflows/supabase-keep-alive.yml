name: Keep Supabase Active

on:
    schedule:
        - cron: '0 9 */3 * *' # Every 3 days at 09:00 UTC
    workflow_dispatch:

jobs:
    ping:
        runs-on: ubuntu-latest
        steps:
            - name: Query analyses table
              run: |
                  STATUS=$(curl -s -o response.txt -w "%{http_code}" \
                    -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
                    "${{ secrets.SUPABASE_URL }}/rest/v1/keep_alive?select=id&limit=1")
                  echo "HTTP $STATUS"
                  if [ "$STATUS" -ge 400 ]; then
                    cat response.txt
                    exit 1
                  fi
